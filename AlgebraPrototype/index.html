
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>MathLive Algebra Prototype</title>

  <script defer src="./dist/app.js"></script>
</head>

<body>
  <h1>Algebra Interface Prototype</h1>

  <p>Enter a mathematical expression:</p>

  <math-field id="expression">2x+3x^3/{4x}</math-field>

  <p>
    <button id="convert">Show MathJSON</button>
    <button id="simplify">Simplify</button>
  </p>
  <button id="inspect-selection">
  Inspect Selection
  </button>

  <h2>Result</h2>
  <pre id="output">No result yet.</pre>
  <pre id="selection-output"></pre>
