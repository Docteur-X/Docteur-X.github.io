
name: Manipulator Verification

on:
  push:
    branches:
      - ci/manipulator-verification
    paths:
      - 'algebra_interface/**'
      - '.github/workflows/manipulator-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node and Playwright tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: algebra_interface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: algebra_interface/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e -- --workers=2

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manipulator-playwright-failures
          path: |
            algebra_interface/test-results/
            algebra_interface/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
